name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26.04 (tested on 24.04)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra usd --extra mcp --extra dxf --extra ifc --extra video --extra hf --extra dev
      - name: Test
        run: uv run pytest -q
