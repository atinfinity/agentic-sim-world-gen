name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned; ubuntu-latest moves to 26.04 (tested on 24.04)
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # the extras the README and Getting Started install: a test that needs another extra must skip, not fail
          - name: documented
            extras: --extra usd --extra hf --extra mcp --extra dev
          # everything but taste (torch): runs the floor plan and photo tests too
          - name: all
            extras: --extra usd --extra mcp --extra dxf --extra ifc --extra photo --extra hf --extra dev
    name: test (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          python-version: "3.12"
      # the same for every matrix entry: once is enough. Pinned: a new ruff adds rules (the version is also in
      # pyproject.toml and docs/contributing.md; change them together)
      - name: Lint
        if: matrix.name == 'all'
        run: uvx ruff@0.17.6 check .
      - name: Install
        run: uv sync --locked ${{ matrix.extras }}
      - name: Test
        run: uv run pytest -q

  # .github/workflows/actions.lock covers every workflow and its pins are valid. The Require lockfile policy pins
  # the actions when a workflow runs; this names what to fix in the pull request (run `gh actions-lock`)
  lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh extension install github/gh-actions-lock --pin v0.4.1
          gh actions-lock --verify
