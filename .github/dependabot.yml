# Dependabot version updates, once a week, one pull request per ecosystem. For an action it also updates
# .github/workflows/actions.lock in the same pull request; CI checks it (the lockfile job).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:  # opencv 5 breaks the photo line detection; lift this when it works (#13)
      - dependency-name: opencv-python-headless
        update-types: ["version-update:semver-major"]
