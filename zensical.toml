# Project page (GitHub Pages), Japanese site: https://atinfinity.github.io/agentic-sim-world-gen/ja/
# The top page (README.ja.md) and the guides in docs/. The English one is zensical.en.toml. Build both: python scripts/build_site.py --build (or --serve to look at it)
[project]
site_name = "agentic-sim-world-gen"
site_description = "日本語の指示・間取り図・写真から、エージェントが Isaac Sim のワールド（USD）を作る"
site_url = "https://atinfinity.github.io/agentic-sim-world-gen/ja/"
docs_dir = "build/site_ja"  # put together by scripts/build_site.py from README.ja.md and docs/
site_dir = "site/ja"
repo_url = "https://github.com/atinfinity/agentic-sim-world-gen"
repo_name = "atinfinity/agentic-sim-world-gen"
edit_uri = "edit/main/docs/"
copyright = "コードは Apache License 2.0。NVIDIA の公式の製品ではありません。"
extra_javascript = ["javascripts/lang.js"]  # the language switch keeps the page
extra_css = ["stylesheets/extra.css"]  # the nav: section titles vs pages
nav = [
  { "トップ" = "index.md" },
  { "利用者向け" = [
    { "はじめに" = "getting-started.md" },
    { "手元の 1 台で使う" = "use-local.md" },
    { "ssh 先の GPU 機で使う" = "use-ssh.md" },
  ] },
  { "開発者向け" = [
    { "仕組み" = "architecture.md" },
    { "開発に参加する" = "contributing.md" },
  ] },
]
not_in_nav = "images/*.md"

[project.extra]
alternate = [
  { name = "English", link = "/agentic-sim-world-gen/", lang = "en" },
  { name = "日本語", link = "/agentic-sim-world-gen/ja/", lang = "ja" },
]

[project.theme]
language = "ja"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }  # keep Japanese headings in anchors, as GitHub does
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
