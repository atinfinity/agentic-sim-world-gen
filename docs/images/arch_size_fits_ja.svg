<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 376" width="932" height="376" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#d0d7de}
  .obj{fill:#cfe3ff;stroke:#2f6fd0;stroke-width:1.5}.obj2{fill:#ffe1c2;stroke:#c8661b;stroke-width:1.5}
  .bad{fill:#ffd7d5;stroke:#cf222e;stroke-width:1.8}.ok{fill:none;stroke:#1a7f37;stroke-width:2;stroke-dasharray:4 3}
  .front{fill:#1f2328}.wall{stroke:#57606a;stroke-width:5;stroke-linecap:round}
  .wbody{fill:#afb8c1}.col{fill:#6e7781}.cl{stroke:#1f2328;stroke-width:1.2;stroke-dasharray:6 3;fill:none}
  .face{stroke:#1a7f37;stroke-width:3;stroke-linecap:butt;fill:none}.glass{stroke:#2f6fd0;stroke-width:2}
  .keep{fill:#fff1c2;stroke:#bf8700;stroke-width:1;stroke-dasharray:3 2}
  .zoneA{fill:#e7f0ff}.zoneB{fill:#f3ecff}.floor{fill:#ffffff}
  .hint{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}.axis{stroke:#57606a;stroke-width:1.5;fill:none}
  .dimln{stroke:#57606a;stroke-width:1;fill:none}.badln{stroke:#cf222e;stroke-width:1.5;fill:none}
  .pivot{fill:#cf222e;stroke:#ffffff;stroke-width:1.5}
  .lbl{font-size:13px;text-anchor:middle;fill:#1f2328}.sm{font-size:11px;fill:#57606a}
  .dim{font-size:12px;fill:#57606a;text-anchor:middle}.name{font-size:15px;font-weight:600;fill:#1f2328}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mono{font-size:12px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .desc{font-size:13px;fill:#57606a}.legend{font-size:13px;fill:#57606a}.badt{fill:#cf222e}.okt{fill:#1a7f37}.warnt{fill:#9a6700}
  .tag{font-size:11px;font-weight:600}.verdict{font-size:13px;font-weight:600}#ah path{fill:#57606a}#ahr path{fill:#cf222e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#30363d}
    .obj{fill:#1d3b66;stroke:#79b0ff}.obj2{fill:#5a3414;stroke:#f0a060}.bad{fill:#5c1a1a;stroke:#ff7b72}.ok{stroke:#3fb950}
    .front{fill:#e6edf3}.wall{stroke:#8b949e}.wbody{fill:#6e7681}.col{fill:#adbac7}.cl{stroke:#e6edf3}
    .face{stroke:#3fb950}.glass{stroke:#79b0ff}.keep{fill:#4a3a0a;stroke:#d29922}
    .zoneA{fill:#132a4a}.zoneB{fill:#2d1f47}.floor{fill:#0d1117}.axis,.dimln{stroke:#8b949e}.badln{stroke:#ff7b72}
    .pivot{fill:#ff7b72;stroke:#0d1117}
    .lbl,.name,.mono{fill:#e6edf3}.dim,.desc,.legend,.sm{fill:#8b949e}.badt{fill:#ff7b72}.okt{fill:#3fb950}.warnt{fill:#d29922}
    #ah path{fill:#8b949e}#ahr path{fill:#ff7b72}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="932" height="376" rx="8"/>
<text class="name code" x="22" y="34" style="text-anchor:start">max_size = (1.6, 0.8, 0.8)　…（長辺, 短辺, 高さ）の上限 [m]</text>
<g transform="translate(16,46)"><rect class="card" x="6" y="6" width="288" height="256" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">size_m = (1.4, 0.7, 0.75)</text><text class="desc" x="20" y="230" style="text-anchor:start">(長辺, 短辺, 高さ) = (1.4, 0.7, 0.75)</text><text class="desc" x="20" y="248" style="text-anchor:start"></text><g transform="translate(0,6)"><rect class="hint" x="36" y="84" width="112" height="56" rx="0"/><rect class="obj" x="43" y="87.5" width="98" height="49" rx="0"/><text class="sm" x="92" y="76" style="text-anchor:middle">w=1.4</text><text class="sm" x="154" y="116" style="text-anchor:start">d=0.7</text><text class="dim" x="92" y="186">上から</text><line class="wall" x1="184" y1="160" x2="268" y2="160"/><line class="hint" x1="184" y1="104" x2="268" y2="104"/><rect class="obj" x="196" y="107.5" width="40" height="52.5" rx="0"/><text class="sm" x="216" y="101.5" style="text-anchor:middle">h=0.75</text><text class="dim" x="226" y="186">横から</text><text class="verdict okt" x="20" y="242" style="text-anchor:start">→ 合う</text></g></g>
<g transform="translate(316,46)"><rect class="card" x="6" y="6" width="288" height="256" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">size_m = (0.7, 1.4, 0.75)</text><text class="desc" x="20" y="230" style="text-anchor:start">(長辺, 短辺, 高さ) = (1.4, 0.7, 0.75)</text><text class="desc" x="20" y="248" style="text-anchor:start"></text><g transform="translate(0,6)"><rect class="hint" x="64" y="56" width="56" height="112" rx="0"/><rect class="obj" x="67.5" y="63" width="49" height="98" rx="0"/><text class="sm" x="92" y="48" style="text-anchor:middle">w=0.7</text><text class="sm" x="126" y="116" style="text-anchor:start">d=1.4</text><text class="dim" x="92" y="186">上から</text><line class="wall" x1="184" y1="160" x2="268" y2="160"/><line class="hint" x1="184" y1="104" x2="268" y2="104"/><rect class="obj" x="196" y="107.5" width="40" height="52.5" rx="0"/><text class="sm" x="216" y="101.5" style="text-anchor:middle">h=0.75</text><text class="dim" x="226" y="186">横から</text><text class="verdict okt" x="20" y="242" style="text-anchor:start">→ 合う</text></g></g>
<g transform="translate(616,46)"><rect class="card" x="6" y="6" width="288" height="256" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">size_m = (1.4, 0.7, 1.1)</text><text class="desc" x="20" y="230" style="text-anchor:start">(長辺, 短辺, 高さ) = (1.4, 0.7, 1.1)</text><text class="desc" x="20" y="248" style="text-anchor:start"></text><g transform="translate(0,6)"><rect class="hint" x="36" y="84" width="112" height="56" rx="0"/><rect class="obj" x="43" y="87.5" width="98" height="49" rx="0"/><text class="sm" x="92" y="76" style="text-anchor:middle">w=1.4</text><text class="sm" x="154" y="116" style="text-anchor:start">d=0.7</text><text class="dim" x="92" y="186">上から</text><line class="wall" x1="184" y1="160" x2="268" y2="160"/><line class="hint" x1="184" y1="104" x2="268" y2="104"/><rect class="bad" x="196" y="83" width="40" height="77" rx="0"/><text class="sm" x="216" y="77" style="text-anchor:middle">h=1.1</text><text class="dim" x="226" y="186">横から</text><text class="verdict badt" x="20" y="242" style="text-anchor:start">→ 合わない（高さ1.1 &gt; 0.8）</text></g></g>
<text class="legend" x="22" y="342" style="text-anchor:start">破線がmax_size。fitsはアセットの(幅, 奥行き, 高さ)を(長辺, 短辺, 高さ)に並べ替えて比べるので、</text>
<text class="legend" x="22" y="362" style="text-anchor:start">アセットがどちら向きに作られていても同じ結果になる。min_sizeも同じ並びで下限を比べる。</text>
</svg>
