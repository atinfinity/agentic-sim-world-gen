<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 752" width="932" height="752" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#d0d7de}
  .obj{fill:#cfe3ff;stroke:#2f6fd0;stroke-width:1.5}.obj2{fill:#ffe1c2;stroke:#c8661b;stroke-width:1.5}
  .bad{fill:#ffd7d5;stroke:#cf222e;stroke-width:1.8}.ok{fill:none;stroke:#1a7f37;stroke-width:2;stroke-dasharray:4 3}
  .front{fill:#1f2328}.wall{stroke:#57606a;stroke-width:5;stroke-linecap:round}
  .wbody{fill:#afb8c1}.col{fill:#6e7781}.cl{stroke:#1f2328;stroke-width:1.2;stroke-dasharray:6 3;fill:none}
  .face{stroke:#1a7f37;stroke-width:3;stroke-linecap:butt;fill:none}.glass{stroke:#2f6fd0;stroke-width:2}
  .keep{fill:#fff1c2;stroke:#bf8700;stroke-width:1;stroke-dasharray:3 2}
  .zoneA{fill:#e7f0ff}.zoneB{fill:#f3ecff}.floor{fill:#ffffff}
  .hint{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}.axis{stroke:#57606a;stroke-width:1.5;fill:none}
  .dimln{stroke:#57606a;stroke-width:1;fill:none}.badln{stroke:#cf222e;stroke-width:1.5;fill:none}
  .pivot{fill:#cf222e;stroke:#ffffff;stroke-width:1.5}
  .lbl{font-size:13px;text-anchor:middle;fill:#1f2328}.sm{font-size:11px;fill:#57606a}
  .dim{font-size:12px;fill:#57606a;text-anchor:middle}.name{font-size:15px;font-weight:600;fill:#1f2328}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mono{font-size:12px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .desc{font-size:13px;fill:#57606a}.legend{font-size:13px;fill:#57606a}.badt{fill:#cf222e}.okt{fill:#1a7f37}.warnt{fill:#9a6700}
  .tag{font-size:11px;font-weight:600}.verdict{font-size:13px;font-weight:600}#ah path{fill:#57606a}#ahr path{fill:#cf222e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#30363d}
    .obj{fill:#1d3b66;stroke:#79b0ff}.obj2{fill:#5a3414;stroke:#f0a060}.bad{fill:#5c1a1a;stroke:#ff7b72}.ok{stroke:#3fb950}
    .front{fill:#e6edf3}.wall{stroke:#8b949e}.wbody{fill:#6e7681}.col{fill:#adbac7}.cl{stroke:#e6edf3}
    .face{stroke:#3fb950}.glass{stroke:#79b0ff}.keep{fill:#4a3a0a;stroke:#d29922}
    .zoneA{fill:#132a4a}.zoneB{fill:#2d1f47}.floor{fill:#0d1117}.axis,.dimln{stroke:#8b949e}.badln{stroke:#ff7b72}
    .pivot{fill:#ff7b72;stroke:#0d1117}
    .lbl,.name,.mono{fill:#e6edf3}.dim,.desc,.legend,.sm{fill:#8b949e}.badt{fill:#ff7b72}.okt{fill:#3fb950}.warnt{fill:#d29922}
    #ah path{fill:#8b949e}#ahr path{fill:#ff7b72}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="932" height="752" rx="8"/>
<g transform="translate(16,16)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name" x="20" y="30" style="text-anchor:start">アセット（例：Y-up・cm）</text><text class="desc" x="20" y="224" style="text-anchor:start">Z-upのステージでは寝ている。</text><text class="desc" x="20" y="242" style="text-anchor:start">●がpivot（bbox底面のfootprint中心）</text><g transform="translate(0,12)"><rect class="obj" x="64" y="114" width="144" height="32" rx="0"/><line class="axis" x1="20" y1="172" x2="274" y2="172" marker-end="url(#ah)"/><text class="dim" x="276" y="188">+Y</text><line class="axis" x1="40" y1="194" x2="40" y2="60" marker-end="url(#ah)"/><text class="dim" x="28" y="64">+Z</text><line class="dimln" x1="94" y1="130" x2="186" y2="130" marker-end="url(#ah)"/><text class="sm" x="140" y="106" style="text-anchor:middle">アセットの上</text><circle class="pivot" cx="64" cy="130.0" r="5"/><text class="sm code" x="58" y="106" style="text-anchor:middle">pivot</text><text class="sm" x="44" y="188" style="text-anchor:start">原点</text></g><text class="dim" x="278" y="30" text-anchor="end">1</text></g>
<g transform="translate(316,16)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">translate:pivot</text><text class="desc" x="20" y="242" style="text-anchor:start">−pivotだけ動かし、pivotを原点に</text><g transform="translate(0,12)"><rect class="obj" x="40" y="124" width="144" height="32" rx="0"/><line class="axis" x1="20" y1="140" x2="274" y2="140" marker-end="url(#ah)"/><text class="dim" x="276" y="156">+Y</text><line class="axis" x1="40" y1="162" x2="40" y2="60" marker-end="url(#ah)"/><text class="dim" x="28" y="64">+Z</text><circle class="pivot" cx="40" cy="140" r="5"/><line class="dimln" x1="70" y1="140" x2="162" y2="140" marker-end="url(#ah)"/><text class="sm" x="116" y="116" style="text-anchor:middle">アセットの上</text></g><text class="dim" x="278" y="30" text-anchor="end">2</text></g>
<g transform="translate(616,16)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">rotateX:upAxis</text><text class="desc" x="20" y="242" style="text-anchor:start">Y-upのアセットだけ90°回して立てる</text><g transform="translate(0,12)"><line class="axis" x1="60" y1="200" x2="260" y2="200" marker-end="url(#ah)"/><text class="dim" x="262" y="216">+Y</text><line class="axis" x1="150" y1="222" x2="150" y2="44" marker-end="url(#ah)"/><text class="dim" x="138" y="48">+Z</text><rect class="obj" x="134" y="56" width="32" height="144" rx="0"/><circle class="pivot" cx="150" cy="200" r="5"/><line class="dimln" x1="150" y1="166" x2="150" y2="74" marker-end="url(#ah)"/><text class="sm" x="174" y="128" style="text-anchor:start">アセットの上</text><path class="hint" d="M210 186 A60 60 0 0 0 164 140" marker-end="url(#ah)"/><text class="dim" x="212" y="148">90°</text></g><text class="dim" x="278" y="30" text-anchor="end">3</text></g>
<g transform="translate(16,278)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">scale</text><text class="desc" x="20" y="242" style="text-anchor:start">metersPerUnitを掛ける（cmなら0.01）</text><g transform="translate(0,12)"><line class="axis" x1="60" y1="200" x2="260" y2="200" marker-end="url(#ah)"/><text class="dim" x="262" y="216">+Y</text><line class="axis" x1="150" y1="222" x2="150" y2="44" marker-end="url(#ah)"/><text class="dim" x="138" y="48">+Z</text><rect class="hint" x="134" y="56" width="32" height="144" rx="0"/><rect class="obj" x="144.72" y="152.48" width="10.56" height="47.52" rx="0"/><circle class="pivot" cx="150" cy="200" r="4"/><text class="sm" x="174" y="68" style="text-anchor:start">180（cm）</text><text class="sm" x="164" y="180.24" style="text-anchor:start">1.8（m）</text><line class="dimln" x1="196" y1="78" x2="180" y2="148.48" marker-end="url(#ah)"/></g><text class="dim" x="278" y="30" text-anchor="end">4</text></g>
<g transform="translate(316,278)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">rotateZ</text><text class="desc" x="20" y="224" style="text-anchor:start">上から見て正面（+X、三角）を</text><text class="desc" x="20" y="242" style="text-anchor:start">yaw_degの向きへ回す</text><g transform="translate(0,12)"><line class="axis" x1="50" y1="118" x2="262" y2="118" marker-end="url(#ah)"/><text class="dim" x="262" y="134">+X（東）</text><line class="axis" x1="150" y1="198" x2="150" y2="34" marker-end="url(#ah)"/><text class="dim" x="160" y="38" style="text-anchor:start">+Y（北）</text><polygon class="hint" points="118,102 182,102 182,134 118,134"/><polygon class="obj" points="134,150 134,86 166,86 166,150"/><polygon class="front" points="144,86 156,86 150,77"/><circle class="pivot" cx="150" cy="118" r="4"/><path class="hint" d="M220 118 A70 70 0 0 0 150 48" marker-end="url(#ah)"/><text class="sm code" x="208" y="64" style="text-anchor:start">yaw_deg</text></g><text class="dim" x="278" y="30" text-anchor="end">5</text></g>
<g transform="translate(616,278)"><rect class="card" x="6" y="6" width="288" height="250" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">translate</text><text class="desc" x="20" y="224" style="text-anchor:start">部屋の中の位置（x, y）と高さzへ</text><text class="desc" x="20" y="242" style="text-anchor:start">（zは床0・段差・載せた物の上面）</text><g transform="translate(0,12)"><rect class="floor" x="52" y="44" width="196" height="128" rx="0"/><rect class="hint" x="52" y="44" width="196" height="128"/><line class="axis" x1="52" y1="172" x2="270" y2="172" marker-end="url(#ah)"/><text class="dim" x="266" y="188">x</text><line class="axis" x1="52" y1="172" x2="52" y2="26" marker-end="url(#ah)"/><text class="dim" x="42" y="34">y</text><text class="sm" x="48" y="188" style="text-anchor:middle">(0, 0)</text><line class="hint" x1="56" y1="168" x2="180" y2="104" marker-end="url(#ah)"/><polygon class="obj" points="184,108 184,76 200,76 200,108"/><polygon class="front" points="186,76 198,76 192,67"/><circle class="pivot" cx="192" cy="92" r="3.5"/><text class="sm" x="210" y="122" style="text-anchor:start">(x, y)</text></g><text class="dim" x="278" y="30" text-anchor="end">6</text></g>
<g><rect class="card" x="22" y="546" width="888" height="156" rx="8"/><text class="name" x="36" y="570" style="text-anchor:start">primの形（scene.usda）</text><rect class="box" x="36" y="584" width="560" height="108" rx="6"/><text class="mono" x="48" y="606" style="text-anchor:start">/World/Objects/&lt;id&gt;　Xform</text><text class="mono" x="48" y="628" style="text-anchor:start">xformOpOrder = [translate, rotateZ, scale,</text><text class="mono" x="163.2" y="646" style="text-anchor:start">rotateX:upAxis, translate:pivot]</text><text class="mono" x="48" y="668" style="text-anchor:start">customData: agentic_sim_world_gen:{source, uri, license, label}</text><text class="sm" x="48" y="686" style="text-anchor:start">点に効くのは右から（上の図の1→6の順）</text><line class="axis" x1="596" y1="638" x2="638" y2="638" marker-end="url(#ah)"/><text class="dim" x="619" y="630">子</text><rect class="box" x="642" y="584" width="254" height="108" rx="6"/><text class="mono" x="654" y="606" style="text-anchor:start">Asset</text><text class="mono" x="654" y="628" style="text-anchor:start">references: アセットのURI</text><text class="mono" x="654" y="646" style="text-anchor:start">variant: PhysX=Enabled</text><text class="sm" x="654" y="668" style="text-anchor:start">アセット自身のルートの</text><text class="sm" x="654" y="686" style="text-anchor:start">変換はここに残る</text></g>
<text class="legend" x="22" y="736" style="text-anchor:start">横から見た図（1〜4）と上から見た図（5・6）。●がpivot、三角が正面。4の縮み方は模式（実際は1/100）。</text>
</svg>
