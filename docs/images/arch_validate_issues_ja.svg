<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 534" width="920" height="534" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.box{fill:#ffffff;stroke:#d0d7de}
  .obj{fill:#cfe3ff;stroke:#2f6fd0;stroke-width:1.5}.obj2{fill:#ffe1c2;stroke:#c8661b;stroke-width:1.5}
  .bad{fill:#ffd7d5;stroke:#cf222e;stroke-width:1.8}.ok{fill:none;stroke:#1a7f37;stroke-width:2;stroke-dasharray:4 3}
  .front{fill:#1f2328}.wall{stroke:#57606a;stroke-width:5;stroke-linecap:round}
  .wbody{fill:#afb8c1}.col{fill:#6e7781}.cl{stroke:#1f2328;stroke-width:1.2;stroke-dasharray:6 3;fill:none}
  .face{stroke:#1a7f37;stroke-width:3;stroke-linecap:butt;fill:none}.glass{stroke:#2f6fd0;stroke-width:2}
  .keep{fill:#fff1c2;stroke:#bf8700;stroke-width:1;stroke-dasharray:3 2}
  .zoneA{fill:#e7f0ff}.zoneB{fill:#f3ecff}.floor{fill:#ffffff}
  .hint{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}.axis{stroke:#57606a;stroke-width:1.5;fill:none}
  .dimln{stroke:#57606a;stroke-width:1;fill:none}.badln{stroke:#cf222e;stroke-width:1.5;fill:none}
  .pivot{fill:#cf222e;stroke:#ffffff;stroke-width:1.5}
  .lbl{font-size:13px;text-anchor:middle;fill:#1f2328}.sm{font-size:11px;fill:#57606a}
  .dim{font-size:12px;fill:#57606a;text-anchor:middle}.name{font-size:15px;font-weight:600;fill:#1f2328}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.mono{font-size:12px;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .desc{font-size:13px;fill:#57606a}.legend{font-size:13px;fill:#57606a}.badt{fill:#cf222e}.okt{fill:#1a7f37}.warnt{fill:#9a6700}
  .tag{font-size:11px;font-weight:600}.verdict{font-size:13px;font-weight:600}#ah path{fill:#57606a}#ahr path{fill:#cf222e}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.box{fill:#0d1117;stroke:#30363d}
    .obj{fill:#1d3b66;stroke:#79b0ff}.obj2{fill:#5a3414;stroke:#f0a060}.bad{fill:#5c1a1a;stroke:#ff7b72}.ok{stroke:#3fb950}
    .front{fill:#e6edf3}.wall{stroke:#8b949e}.wbody{fill:#6e7681}.col{fill:#adbac7}.cl{stroke:#e6edf3}
    .face{stroke:#3fb950}.glass{stroke:#79b0ff}.keep{fill:#4a3a0a;stroke:#d29922}
    .zoneA{fill:#132a4a}.zoneB{fill:#2d1f47}.floor{fill:#0d1117}.axis,.dimln{stroke:#8b949e}.badln{stroke:#ff7b72}
    .pivot{fill:#ff7b72;stroke:#0d1117}
    .lbl,.name,.mono{fill:#e6edf3}.dim,.desc,.legend,.sm{fill:#8b949e}.badt{fill:#ff7b72}.okt{fill:#3fb950}.warnt{fill:#d29922}
    #ah path{fill:#8b949e}#ahr path{fill:#ff7b72}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="920" height="534" rx="8"/>
<g transform="translate(16,16)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">out_of_room</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="198" style="text-anchor:start">足元が部屋の外に出る</text><text class="desc" x="20" y="216" style="text-anchor:start">（間取りではゾーンの外）</text><line class="wall" x1="30" y1="56" x2="30" y2="150"/><line class="wall" x1="30" y1="150" x2="160" y2="150"/><line class="wall" x1="30" y1="56" x2="160" y2="56"/><line class="wall" x1="160" y1="56" x2="160" y2="150"/><rect class="obj" x="56" y="84" width="50" height="40" rx="0"/><rect class="bad" x="136" y="90" width="52" height="34" rx="0"/></g>
<g transform="translate(238,16)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">overlap</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="198" style="text-anchor:start">足元の多角形が重なり（SAT）、</text><text class="desc" x="20" y="216" style="text-anchor:start">高さの範囲も重なる</text><polygon class="obj" points="41,79 137,79 137,129 41,129"/><polygon class="obj2" points="111.112,95.2652 163.735,76.112 182.888,128.735 130.265,147.888"/><polygon class="bad" points="111.112,95.2652 137,85.8427 137,129 123.391,129"/></g>
<g transform="translate(460,16)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">too_tall</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="198" style="text-anchor:start">上端（z＋高さ）が天井より上</text><text class="desc" x="20" y="216" style="text-anchor:start">（横から見た図）</text><line class="wall" x1="30" y1="156" x2="192" y2="156"/><line class="badln" x1="30" y1="74" x2="192" y2="74"/><text class="sm code" x="30" y="68" style="text-anchor:start">room.height</text><rect class="obj" x="56" y="100" width="60" height="56" rx="0"/><rect class="bad" x="132" y="54" width="40" height="102" rx="0"/></g>
<g transform="translate(682,16)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">blocks_door</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="198" style="text-anchor:start">ドアの前の空き（両側）に入る</text><text class="desc" x="20" y="216" style="text-anchor:start">深さは既定で幅（最大0.9 m）</text><line class="wall" x1="24" y1="64" x2="80" y2="64"/><line class="wall" x1="140" y1="64" x2="198" y2="64"/><rect class="keep" x="80" y="64" width="60" height="52" rx="0"/><text class="sm code" x="110" y="58" style="text-anchor:middle">door</text><rect class="bad" x="118" y="96" width="62" height="44" rx="0"/></g>
<g transform="translate(16,252)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">hits_wall</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="198" style="text-anchor:start">間取りの壁の本体に食い込む</text><text class="desc" x="20" y="216" style="text-anchor:start">（矩形の部屋はout_of_room）</text><rect class="wbody" x="140" y="50" width="12" height="106" rx="0"/><line class="cl" x1="146" y1="50" x2="146" y2="156"/><rect class="obj" x="60" y="76" width="50" height="40" rx="0"/><rect class="bad" x="112" y="112" width="44" height="34" rx="0"/></g>
<g transform="translate(238,252)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">narrow_aisle</text><text class="tag warnt" x="204" y="30" style="text-anchor:end">警告</text><text class="desc" x="20" y="180" style="text-anchor:start">棚などの前への道が</text><text class="desc" x="20" y="198" style="text-anchor:start">場所の通路幅より狭い</text><text class="desc" x="20" y="216" style="text-anchor:start">（家0.75・店1.0・既定0.9 m）</text><rect class="obj2" x="34" y="48" width="54" height="24" rx="0"/><polygon class="front" points="88,54 88,66 96,60"/><rect class="obj2" x="132" y="48" width="54" height="24" rx="0"/><polygon class="front" points="132,54 132,66 124,60"/><rect class="obj2" x="34" y="76" width="54" height="24" rx="0"/><polygon class="front" points="88,82 88,94 96,88"/><rect class="obj2" x="132" y="76" width="54" height="24" rx="0"/><polygon class="front" points="132,82 132,94 124,88"/><rect class="obj2" x="34" y="104" width="54" height="24" rx="0"/><polygon class="front" points="88,110 88,122 96,116"/><rect class="obj2" x="132" y="104" width="54" height="24" rx="0"/><polygon class="front" points="132,110 132,122 124,116"/><line class="badln" x1="98" y1="140" x2="122" y2="140" marker-end="url(#ahr)"/><line class="badln" x1="122" y1="140" x2="98" y2="140" marker-end="url(#ahr)"/><text class="sm" x="110" y="158" style="text-anchor:middle">通路</text></g>
<g transform="translate(460,252)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">tuck_pair</text><text class="tag okt" x="204" y="30" style="text-anchor:end">許される</text><text class="desc" x="20" y="180" style="text-anchor:start">椅子は机の下に、足元の</text><text class="desc" x="20" y="198" style="text-anchor:start">短辺の60%（MAX_TUCK）</text><text class="desc" x="20" y="216" style="text-anchor:start">まで入れてよい</text><rect class="obj" x="40" y="58" width="140" height="56" rx="0"/><text class="lbl" x="110" y="82">机</text><rect class="obj2" x="88" y="96" width="44" height="44" rx="0"/><rect class="ok" x="88" y="96" width="44" height="18" rx="0"/><line class="dimln" x1="138" y1="96" x2="138" y2="114"/><text class="sm" x="142" y="130" style="text-anchor:start">≤0.6×短辺</text><text class="lbl" x="110" y="158">椅子</text></g>
<g transform="translate(682,252)"><rect class="card" x="6" y="6" width="210" height="224" rx="8"/><text class="name code" x="20" y="30" style="text-anchor:start">overlap</text><text class="tag badt" x="204" y="30" style="text-anchor:end">issue</text><text class="desc" x="20" y="180" style="text-anchor:start">机の角から差し込むと</text><text class="desc" x="20" y="198" style="text-anchor:start">脚に当たる。辺から入れる</text><text class="desc" x="20" y="216" style="text-anchor:start">（through_side）</text><rect class="obj" x="40" y="58" width="120" height="56" rx="0"/><text class="lbl" x="96" y="90">机</text><rect class="obj2" x="140" y="94" width="44" height="44" rx="0"/><rect class="bad" x="140" y="94" width="20" height="20" rx="0"/><text class="lbl" x="162" y="158">椅子</text></g>
<text class="legend" x="22" y="518" style="text-anchor:start">上から見た図（too_tallは横から）。赤が問題の物、黄がドアの前の空き、緑の破線が許される重なり。issueは0件まで直す。</text>
</svg>
