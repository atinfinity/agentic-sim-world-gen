<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 562" width="932" height="562" font-family="'Noto Sans JP','Hiragino Sans','Yu Gothic',sans-serif">
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.obj{fill:#cfe3ff;stroke:#2f6fd0;stroke-width:1.5}
  .obj2{fill:#ffe1c2;stroke:#c8661b;stroke-width:1.5;fill-opacity:0.85}.bad{fill:#ffd7d5;stroke:#cf222e;stroke-width:1.5}
  .fixed{fill:#d8dee4;stroke:#57606a;stroke-width:1.5}.ghost{fill:none;stroke:#2f6fd0;stroke-width:1.5;stroke-dasharray:4 3}
  .robot{fill:#ffe1c2;stroke:#c8661b;stroke-width:1.5}.pin{stroke:#57606a;stroke-width:4;stroke-linecap:round}
  .leg{stroke:#2f6fd0;stroke-width:3;fill:none;stroke-linecap:round}
  .floor{stroke:#57606a;stroke-width:4;stroke-linecap:round}
  .hint{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
  .dim{font-size:13px;fill:#57606a;text-anchor:middle}.note{font-size:12px;fill:#57606a;text-anchor:middle}
  .err{font-size:13px;fill:#cf222e;text-anchor:middle;font-weight:600}
  .name{font-size:15px;font-weight:600;fill:#1f2328;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .desc{font-size:13px;fill:#57606a}.legend{font-size:13px;fill:#57606a}#ah path{fill:#8c959f}
  @media (prefers-color-scheme: dark){
    .bg{fill:#0d1117}.card{fill:#161b22;stroke:#30363d}.obj{fill:#1d3b66;stroke:#79b0ff}.obj2{fill:#5a3414;stroke:#f0a060}
    .bad{fill:#5d1a1d;stroke:#ff7b72}.fixed{fill:#30363d;stroke:#8b949e}.ghost{stroke:#79b0ff}
    .robot{fill:#5a3414;stroke:#f0a060}.pin,.floor{stroke:#8b949e}.leg{stroke:#79b0ff}
    .name{fill:#e6edf3}.dim,.desc,.legend,.note{fill:#8b949e}.err{fill:#ff7b72}
  }
</style>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" width="932" height="562" rx="8"/>
<g transform="translate(16,16)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">unstable</text><text class="desc" x="20" y="208">物理を流す間に2cm以上動いた・倒れた</text><text class="desc" x="20" y="226">（物ごとのmax_displacement_mで判定）</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="obj" x="68" y="70" width="24" height="80" rx="2"/><rect class="bad" x="180" y="126" width="80" height="24" rx="2"/></g></g>
<g transform="translate(316,16)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">sunk</text><text class="desc" x="20" y="208">落ち着いた後、物の底が床より</text><text class="desc" x="20" y="226">1cmを超えて下にある</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="obj" x="50" y="110" width="60" height="40" rx="2"/><rect class="bad" x="190" y="128" width="60" height="40" rx="2"/><line class="floor" x1="180" y1="150" x2="260" y2="150" opacity="0.6"/><text class="note" x="256" y="164" style="text-anchor:start">床下</text></g></g>
<g transform="translate(616,16)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">no_collider</text><text class="desc" x="20" y="208">当たり判定が無い</text><text class="desc" x="20" y="226">（ロボットがすり抜ける）</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="ghost" x="58" y="100" width="44" height="50" rx="2"/><rect class="robot" x="34" y="124" width="34" height="22" rx="4"/><circle class="robot" cx="42" cy="146" r="4"/><circle class="robot" cx="60" cy="146" r="4"/><rect class="ghost" x="198" y="100" width="44" height="50" rx="2"/><rect class="robot" x="203" y="124" width="34" height="22" rx="4"/><circle class="robot" cx="211" cy="146" r="4"/><circle class="robot" cx="229" cy="146" r="4"/><text class="note" x="51" y="88">ロボット</text></g></g>
<g transform="translate(16,266)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">static</text><text class="desc" x="20" y="208">当たり判定はあるが剛体でない</text><text class="desc" x="20" y="226">（動かない固定物。家具なら問題ない）</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="fixed" x="58" y="78" width="44" height="72" rx="2"/><path class="pin" d="M54 156 h52"/><rect class="fixed" x="198" y="78" width="44" height="72" rx="2"/><path class="pin" d="M194 156 h52"/><text class="note" x="220" y="70">動かない</text></g></g>
<g transform="translate(316,266)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">exploded</text><text class="desc" x="20" y="208">位置がNaNになった（重なって吹き飛んだ）</text><text class="desc" x="20" y="226">物ごとの項目で、unstableにも入る</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="obj" x="48" y="110" width="40" height="40" rx="2"/><rect class="obj2" x="72" y="110" width="40" height="40" rx="2"/><rect class="bad" x="162" y="38" width="30" height="30" rx="2" transform="rotate(-30 177 53)"/><rect class="bad" x="246" y="30" width="30" height="30" rx="2" transform="rotate(25 261 45)"/><path class="hint" d="M212 130 L184 76 M228 130 L254 68"/><text class="note" x="220" y="146">NaN</text></g></g>
<g transform="translate(616,266)"><rect class="card" x="6" y="6" width="288" height="238" rx="8"/><text class="name" x="20" y="30">blew_up</text><text class="desc" x="20" y="208">GPU物理が止まった時、吹き飛んだ物</text><text class="desc" x="20" y="226">（errorは「physics did not run」）</text><g transform="translate(0,12)"><line class="floor" x1="20" y1="150" x2="280" y2="150"/><path class="hint" d="M122 95 H178" marker-end="url(#ah)"/><text class="dim" x="80" y="40">前</text><text class="dim" x="220" y="40">後</text><rect class="obj" x="44" y="80" width="8" height="38" rx="2"/><rect class="obj" x="44" y="114" width="32" height="8" rx="2"/><path class="leg" d="M60 122 V144 M48 146 H72"/><rect class="obj" x="84" y="80" width="8" height="38" rx="2"/><rect class="obj" x="84" y="114" width="32" height="8" rx="2"/><path class="leg" d="M100 122 V144 M88 146 H112"/><text class="err" x="220" y="114">CUDA error</text><text class="err" x="220" y="134">位置が取れない</text></g></g>
<text class="legend" x="22" y="546">横から見た図。左が物理を流す前（書いたとおりの位置）、右が流した後（既定240ステップ＝60 Hzで4秒）。判定はscripts/isaac/check_core.py</text></svg>
