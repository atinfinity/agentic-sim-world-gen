<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 932 522" width="932" height="522" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<style>
  .bg{fill:#ffffff}.card{fill:#f6f8fa;stroke:#d0d7de}.obj{fill:#cfe3ff;stroke:#2f6fd0;stroke-width:1.5}
